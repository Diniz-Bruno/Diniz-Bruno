name: Update Top Languages SVG

on:
  schedule:
    - cron: "0 6 * * *" # Atualiza todos os dias às 06:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_top_langs.py"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

jobs:
  update-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Top Languages SVG (User + Organizations)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_top_langs.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-langs.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update top-langs.svg including organizations"
            git push
          fi
