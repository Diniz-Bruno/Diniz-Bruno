<svg width="350" height="195" viewBox="0 0 350 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="descId">
  <title id="titleId">My Programming Languages</title>
  <desc id="descId">Most used languages across personal and organization repositories</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #70a5fd;
    }
    .lang-name {
      font: 400 12px 'Inter', 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #38bdae;
    }
  </style>
  <rect data-testid="card-bg" x="0.5" y="0.5" rx="4.5" height="99%" stroke="#E4E2E2" width="349" fill="#1a1b27" stroke-opacity="1"/>
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header" data-testid="header">My Programming Languages</text>
  </g>
  <g transform="translate(25, 55)">
    <mask id="rect-mask">
      <rect x="0" y="0" width="300" height="8" fill="white" rx="5"/>
    </mask>
    <rect mask="url(#rect-mask)" data-testid="lang-progress" x="0.00" y="0" width="125.52" height="8" fill="#178600"/><rect mask="url(#rect-mask)" data-testid="lang-progress" x="125.02" y="0" width="94.72" height="8" fill="#f34b7d"/><rect mask="url(#rect-mask)" data-testid="lang-progress" x="219.24" y="0" width="56.99" height="8" fill="#3572A5"/><rect mask="url(#rect-mask)" data-testid="lang-progress" x="275.73" y="0" width="12.87" height="8" fill="#b07219"/><rect mask="url(#rect-mask)" data-testid="lang-progress" x="288.10" y="0" width="11.68" height="8" fill="#3178c6"/><rect mask="url(#rect-mask)" data-testid="lang-progress" x="299.28" y="0" width="1.22" height="8" fill="#f1e05a"/>
    <g transform="translate(0, 28)">
      <g transform="translate(0, 0)"><circle cx="5" cy="6" r="5" fill="#178600" /><text data-testid="lang-name" x="15" y="10" class="lang-name">C# (41.67%)</text></g><g transform="translate(150, 0)"><circle cx="5" cy="6" r="5" fill="#f34b7d" /><text data-testid="lang-name" x="15" y="10" class="lang-name">C++ (31.41%)</text></g><g transform="translate(0, 25)"><circle cx="5" cy="6" r="5" fill="#3572A5" /><text data-testid="lang-name" x="15" y="10" class="lang-name">Python (18.83%)</text></g><g transform="translate(150, 25)"><circle cx="5" cy="6" r="5" fill="#b07219" /><text data-testid="lang-name" x="15" y="10" class="lang-name">Java (4.12%)</text></g><g transform="translate(0, 50)"><circle cx="5" cy="6" r="5" fill="#3178c6" /><text data-testid="lang-name" x="15" y="10" class="lang-name">TypeScript (3.73%)</text></g><g transform="translate(150, 50)"><circle cx="5" cy="6" r="5" fill="#f1e05a" /><text data-testid="lang-name" x="15" y="10" class="lang-name">JavaScript (0.24%)</text></g>
    </g>
  </g>
