<svg width="350" height="195" viewBox="0 0 350 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="descId">
  <title id="titleId">My Programming Languages</title>
  <desc id="descId">Most used languages across personal and organization repositories</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #70a5fd;
    }
    .lang-name {
      font: 400 12px 'Inter', 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #38bdae;
    }
  </style>
  <rect data-testid="card-bg" x="0.5" y="0.5" rx="4.5" height="99%" stroke="#E4E2E2" width="349" fill="#1a1b27" stroke-opacity="1"/>
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header" data-testid="header">My Programming Languages</text>
  </g>
  <g transform="translate(25, 55)">
    <mask id="rect-mask">
      <rect x="0" y="0" width="300" height="8" fill="white" rx="5"/>
    </mask>
    <rect mask="url(#rect-mask)" data-testid="lang-progress" x="0.00" y="0" width="114.50" height="8" fill="#178600"/>
    <rect mask="url(#rect-mask)" data-testid="lang-progress" x="114.00" y="0" width="78.50" height="8" fill="#3178c6"/>
    <rect mask="url(#rect-mask)" data-testid="lang-progress" x="192.00" y="0" width="60.50" height="8" fill="#f34b7d"/>
    <rect mask="url(#rect-mask)" data-testid="lang-progress" x="252.00" y="0" width="33.50" height="8" fill="#3572A5"/>
    <rect mask="url(#rect-mask)" data-testid="lang-progress" x="285.00" y="0" width="15.00" height="8" fill="#b07219"/>
    <g transform="translate(0, 28)">
      <g transform="translate(0, 0)">
        <circle cx="5" cy="6" r="5" fill="#178600" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">C# (38.12%)</text>
      </g>
      <g transform="translate(155, 0)">
        <circle cx="5" cy="6" r="5" fill="#3178c6" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">TypeScript (26.04%)</text>
      </g>
      <g transform="translate(0, 28)">
        <circle cx="5" cy="6" r="5" fill="#f34b7d" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">C++ (20.15%)</text>
      </g>
      <g transform="translate(155, 28)">
        <circle cx="5" cy="6" r="5" fill="#3572A5" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">Python (10.89%)</text>
      </g>
      <g transform="translate(0, 56)">
        <circle cx="5" cy="6" r="5" fill="#b07219" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">Java (4.80%)</text>
      </g>
    </g>
  </g>
</svg>
